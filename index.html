  const sAg = sumLine("Part D - AI Agent Cost (Annual Recurring Cost)", T.agent, `H${rowAg}`);
  const sM = sumLine(`Part ${mtPart} - Yearly Maintenance Cost (Annual Recurring Cost)`, T.maintenance, `H${rowM}`);
  const rec = sumLine("Annual Recurring Cost (A + D + E)", T.recurring, `H${sA}+H${sAg}+H${sM}`, st.key, st.keyMoney);
  const one = sumLine(cloud ? "Upfront Cost (B + C)" : "One-Time Cost (B + C)", T.oneTime, `H${sB}+H${sC}`, st.key, st.keyMoney);
  sumLine("Total First-Year Investment", T.first, `H${rec}+H${one}`, st.grand, st.grandMoney);
  sumLine(`Total ${CONFIG.years}-Year Investment (at current prices)`, T.three, `H${rec}*${CONFIG.years}+H${one}`, st.grand, st.grandMoney);
  r++;

  // Payment terms
  sh.cell(r, 2, "Payment terms", st.label); r++;
  const payFirst = r;
  const pay = (amount, f, text) => {
    sh.cell(r, 3, amount, st.payAmt, f).cell(r, 4, text, st.payText).merge(r, 4, r, 8, st.payText).height(r, wrapHeight(text, 70, 16)); r++;
  };
  pay(T.recurring, `H${rec}`, `——100% of the yearly licence${T.care ? ", Yonyou Care" : ""}, AI agent and maintenance fees (Parts A, D and E) upon contract signing, and in advance for each renewal. The first 12-month term of agents and maintenance starts on go-live.`);
  pay(T.hardware, `H${sB}`, cloud ? "——100% of the starting AI Unit top-up (Part B) upon contract signing. Later top-ups are paid when purchased." : "——100% of the hardware cost (Part B) upon contract signing.");
  pay(T.workflow * 0.5, `H${sC}*50%`, "——50% of the implementation services fee (Part C) upon contract signing.");
  pay(T.workflow * 0.3, `H${sC}*30%`, "——30% of the implementation services fee upon User Acceptance Testing (UAT).");
  pay(T.workflow * 0.2, `H${sC}*20%`, "——20% of the implementation services fee upon go-live.");
  pay(T.first, `SUM(C${payFirst}:C${r - 1})`, "——First year total.");
  r++;

  // Terms: aligned with the published Terms and Conditions (TC, termsData)
  const pageUrl = /^https?:/i.test(location.href) ? location.href.split("#")[0] + "#terms" : "";
  const termsRef = pageUrl ? `the YonWork Terms and Conditions, Version ${TC.version} (${pageUrl})` : `the YonWork Terms and Conditions, Version ${TC.version}, issued with this quotation`;
  const pct = Math.round(CONFIG.maintRate * 100);
  const termLines = ["Quotation Terms:",
    "1. The quoted price is in Singapore Dollars (SGD).",
    "2. The quoted price excludes taxes. Singapore GST will be charged where applicable.",
    "3. This quotation is valid for one (1) month from the date of issuance.",
    `4. This quotation is subject to ${termsRef}. "Party A" means the client named above and "Party B" means Yonyou Network Technology (Singapore) Private Limited.`,
    `5. Yearly fees (Parts A, D and ${mtPart}) are invoiced on contract signing. The licence term starts on signing; the first 12-month term of AI agents and maintenance starts on go-live.`,
    `6. Recurring prices are fixed for the first ${TC.priceFixMonths} months, then renew at the list price in force, notified at least ${TC.priceNotice} days before renewal. The ${CONFIG.years}-year total is an estimate at current prices.`,
    "",
    "Maintenance Terms:",
    `1. Maintenance is ${pct}% of the implementation services fee (Part C) per year. It covers fixing delivered workflows that stop working as accepted at UAT, changes needed when a YonSuite, YonBIP or NCC upgrade affects them, and re-testing when the AI model in use is retired or replaced.`,
    "2. It does not cover an AI model requested by Party A, new input sources or formats, new features, or changes to Party A's organisation or processes. These are quoted separately.",
    "",
    cloud ? "Cloud AI Terms:" : "Hardware Terms:",
    ...(cloud ? [
      `1. Cloud AI is pay as you go. AI Units (AU) can be topped up at any time at SGD ${CONFIG.auPack} per ${CONFIG.auPerPack.toLocaleString("en-SG")} AU and are valid for ${TC.auValidMonths} months from each top-up.`,
      "2. Workflows that use Cloud AI pause when the AU balance reaches zero. Unused AU are not refundable.",
    ] : [
      `1. Each Enterprise AI Box is sized for about ${CONFIG.usersPerBox} concurrent users. This is a sizing guide, not a performance guarantee.`,
      `2. The Enterprise AI Box is covered by the maker's warranty for ${TC.boxWarrantyYears} year${TC.boxWarrantyYears === 1 ? "" : "s"} from delivery, and Party B files warranty claims on Party A's behalf. Workflows on the box pause while it is under repair unless Yonyou Care is purchased.`,
      "3. Ownership passes to Party A on full payment; risk passes on delivery.",
      "4. The hardware and model named above may be replaced by an equivalent.",
    ]),
    "",
    "Implementation Terms:",
    "1. The man-day cost stated above is an estimate, based on our rapid implementation methodology. Any additional man-days required beyond the estimated scope will incur separate charges and/or require a supplementary contract.",
    "2. If the contract is terminated due to reasons attributable to Party A, Party A agrees to compensate Party B for the service fees corresponding to the number of confirmed man-days delivered.",
    "3. If Party B is unable to fulfill the agreed requirements due to its own fault, both parties shall engage in good-faith discussions to mutually determine an appropriate refund or adjustment to the charges. The total refund shall not exceed 25% of the implementation services fee (Part C) paid by Party A.",
    "4. Any additional development or customizations required beyond the agreed scope will be evaluated after the requirements are confirmed. A separate assessment and quotation will be provided upon confirmation of the final requirements.",
    "5. Party A shall cooperate timely with required testing, data preparation, user testing, and acceptance activities. Delay caused by Party A shall not be deemed as delay by Party B.",
    `6. UAT is accepted on Party A's sign-off, or ${TC.acceptDays} business days after UAT handover if no critical defect is reported, or on first production use, whichever comes first.`,
    `7. Party B fixes defects reported within ${TC.warrantyDays} days after go-live at no charge.`,
    "8. AI output is prepared for Party A's review and approval before it is posted, sent or paid, except for automatic actions agreed in the workflow specification."];
  termLines.forEach(line => {
    if (!line) { r++; return; }
    const head = line.endsWith(":"), style = head ? st.label : st.terms;
    sh.cell(r, 1, line, style).merge(r, 1, r, 8, style).height(r, head ? 17 : wrapHeight(line, FULL_CHARS, 15)); r++;
  });
  r++;

  // Signatures
  sh.cell(r, 1, "Confirmed and Accepted by:", st.label).cell(r, 5, "Confirmed and Accepted by:", st.label); r += 5;
  sh.cell(r, 1, "____________________________").cell(r, 5, "____________________________"); r++;
  sh.cell(r, 1, "Authorized Signature").cell(r, 5, "YONYOU NETWORK TECHNOLOGY (SINGAPORE) PRIVATE LIMITED").merge(r, 5, r, 8); r++;
  sh.cell(r, 1, "(Company Stamp)").cell(r, 5, "(Company Stamp)"); r++;
  sh.cell(r, 1, "(Date)").cell(r, 5, "(Date)");

  const sheetXml = sh.xml([6, 22, 10, 10, 10, 14, 14, 16], r);
  const files = [
    { name: "[Content_Types].xml", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { name: "_rels/.rels", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: "xl/workbook.xml", text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Quotation" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Area" localSheetId="0">Quotation!$A$1:$H$${r}</definedName></definedNames><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: "xl/styles.xml", text: styles.xml() },
    { name: "xl/worksheets/sheet1.xml", text: sheetXml },
  ];
  return zipBlob(files);
}

function quotationFileName() {
  const company = S.client.company.trim().replace(/[\\/:*?"<>|]+/g, " ").trim();
  return company ? `Quotation for ${company}.xlsx` : "YonWork Quotation.xlsx";
}

function downloadQuotation() {
  const url = URL.createObjectURL(buildQuotationXlsx());
  const a = document.createElement("a");
  a.href = url; a.download = quotationFileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const clamp = (n, max) => Math.min(Math.max(Number.isFinite(n) ? Math.trunc(n) : 0, 0), max);
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastTimer;
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}
function goAgent() {
  const s = $("secAgent");
  s.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "center" });
  s.classList.remove("nudge"); void s.offsetWidth; s.classList.add("nudge");
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-toggle],[data-open],[data-filter],[data-step],[data-lang],[data-mode],[data-erp],[data-agent],[data-close],[data-goto],[data-view],[data-goto-id],[data-tref],[data-print]");
  if (!el) return;
  const d = el.dataset;
  if (d.view) { if (viewNow() !== d.view) location.hash = d.view; return; }
  if (d.gotoId) { goTo(d.gotoId); return; }
  if (d.tref) { pendingScroll = "t-" + d.tref; location.hash = "terms"; return; }
  if ("print" in d) { window.print(); return; }
  if (d.toggle) { const id = d.toggle; S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); }
  else if (d.open) S.open = d.open;
  else if ("close" in d) S.open = null;
  else if (d.filter) S.filter = d.filter;
  else if (d.step) { const k = d.step; S[k] = clamp(S[k] + +d.d, MAX[k]); }
  else if (d.mode) S.aiMode = d.mode;
  else if (d.lang) S.lang = d.lang;
  else if (d.erp) S.erp = d.erp;
  else if (d.agent) { const id = d.agent; S.agents.has(id) ? S.agents.delete(id) : S.agents.add(id); }
  else if (d.goto) { goAgent(); return; }
  render();
});
let pendingScroll = null;
const goTo = id => { const el = $(id); if (el) el.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); };
function spy() {
  const toc = $(viewNow() === "faq" ? "faqToc" : "termsToc"); if (!toc) return;
  const btns = [...toc.querySelectorAll("[data-goto-id]")];
  let cur = btns[0];
  btns.forEach(b => { const s = $(b.dataset.gotoId); if (s && s.getBoundingClientRect().top < 140) cur = b; });
  btns.forEach(b => b.classList.toggle("on", b === cur));
}
window.addEventListener("scroll", () => { if (viewNow() !== "estimator") spy(); }, { passive: true });
window.addEventListener("hashchange", () => {
  if (S.open) S.open = null;
  render();
  if (pendingScroll) { const id = pendingScroll; pendingScroll = null; requestAnimationFrame(() => { const el = $(id); if (el) el.scrollIntoView({ block: "start" }); spy(); }); }
  else window.scrollTo(0, 0);
});
$("faqQ").addEventListener("input", e => { S.faqQ = e.target.value; renderDocs("faq"); spy(); });
$("secAgent").addEventListener("animationend", e => e.currentTarget.classList.remove("nudge"));
$("sheet").addEventListener("click", e => { if (e.target === e.currentTarget) { S.open = null; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.open) { S.open = null; render(); } });
const MAX = { users: CONFIG.maxUsers, boxes: CONFIG.maxBoxes, packs: CONFIG.maxPacks };
["users", "boxes", "packs"].forEach(k => {
  const input = $(k);
  input.addEventListener("focus", () => input.select());
  input.addEventListener("input", () => { S[k] = clamp(parseInt(input.value.replace(/\D/g, "") || "0", 10), MAX[k]); render(); });
  input.addEventListener("blur", () => { input.value = S[k]; });
});
$("maint").addEventListener("change", e => { S.maint = e.target.checked; render(); });
$("care").addEventListener("change", e => { S.care = e.target.checked; render(); });
["company", "contact", "email", "manager"].forEach(k => {
  $(k).value = S.client[k] || "";
  $(k).addEventListener("input", e => { S.client[k] = e.target.value; save(); });
});
$("reset").addEventListener("click", () => {
  if (!confirm(L("Clear the quotation and client details?", "清空报价和客户信息？"))) return;
  Object.assign(S, { users: 0, boxes: 0, packs: 0, aiMode: "local", erp: "ys", maint: true, open: null, filter: "all", client: { company: "", contact: "", email: "", manager: "" } });
  S.selected.clear(); S.agents.clear();
  ["company", "contact", "email", "manager"].forEach(k => $(k).value = "");
  render();
});
$("xlsxBtn").addEventListener("click", () => {
  if (totals().needAgent) { toast(t("exportBlocked")); goAgent(); return; }
  downloadQuotation();
});
render();
</script>
</body>
</html>
